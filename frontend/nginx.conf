server {
    listen 80;

    location /ws {
        proxy_pass http://app:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://app:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /crud {
        proxy_pass http://app:8080/crud;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /remove-vowels {
        proxy_pass http://app:8080/remove-vowels;
        proxy_set_header Host $host;
    }

    location /count-consonants {
        proxy_pass http://app:8080/count-consonants;
        proxy_set_header Host $host;
    }

    location /letter-map {
        proxy_pass http://app:8080/letter-map;
        proxy_set_header Host $host;
    }

    location /exception {
        proxy_pass http://app:8080/exception;
        proxy_set_header Host $host;
    }
}