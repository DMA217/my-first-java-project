version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: java_learning
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: library-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/java_learning
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      NGROK_ENABLED: "false"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: library-frontend
    ports:
      - "80:80"
    depends_on:
      - app

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "app:8080"
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: 20GkJfamObsyNdOmSAe42QJGdgs_33ZJJLtnVuUHiQqjMkMxH

volumes:
  pgdata: